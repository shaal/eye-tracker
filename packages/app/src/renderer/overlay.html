<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: http://localhost:*;"
    />
    <title>Eye Tracker Overlay</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        /* Belt and braces: the window is already click-through via
           setIgnoreMouseEvents, but this guarantees no element can capture a
           pointer event even if that flag is lost. */
        pointer-events: none;
        user-select: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="overlay"></canvas>
    <script type="module" src="./overlay/main.ts"></script>
  </body>
</html>
